<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    .left-panel { width: 38%; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; }
    .right-panel { width: 62%; height: 100%; }
    
    #clock { font-size: 3.2rem; font-weight: bold; color: #58a6ff; line-height: 1; }
    #date { font-size: 1.1rem; color: #8b949e; margin-top: 5px; margin-bottom: 15px; text-transform: capitalize; }
    
    .weather-box { background: #21262d; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #30363d; }
    .temp-main { font-size: 2.8rem; font-weight: bold; color: #f0883e; display: inline-block; }
    .temp-feels { font-size: 1.1rem; color: #8b949e; margin-left: 10px; display: inline-block; }
    .weather-details { margin-top: 8px; font-size: 0.95rem; color: #c9d1d9; display: flex; gap: 15px; }
    .forecast-row { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid #30363d; font-size: 0.85rem; color: #8b949e; text-align: center; }
    
    .rss-box { background: #21262d; padding: 15px; border-radius: 8px; border: 1px solid #30363d; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
    .rss-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #ffb703; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
    .rss-container { font-size: 0.88rem; color: #c9d1d9; line-height: 1.4; overflow-y: auto; }
    .rss-item { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    .rss-item-title { font-weight: 600; color: #e6edf3; }
    .rss-item-desc { font-size: 0.8rem; color: #8b949e; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="left-panel">
    <div>
      <div id="clock">00:00</div>
      <div id="date">Laadimine...</div>
      
      <!-- Ilmaplokk -->
      <div class="weather-box">
        <div>
          <span class="temp-main" id="temp">--°C</span>
          <span class="temp-feels" id="feels">Tundub: --°C</span>
        </div>
        <div class="weather-details">
          <span id="wind">Tuul: -- m/s</span>
          <span id="humidity">Niiskus: --%</span>
        </div>
        <div class="forecast-row" id="forecast">
          <span>Laen prognoosi...</span>
        </div>
      </div>
    </div>
    
    <div class="rss-box">
      <div class="rss-title">ERR Uudised</div>
      <div class="rss-container" id="rss-feed">Laen uudiseid...</div>
    </div>
  </div>

  <div class="right-panel">
    <iframe src="https://www.rainviewer.com/map.html?loc=58.60,25.00,7&o8=1&c=1&o=0&lm=1&a=1"></iframe>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('et-EE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').innerText = now.toLocaleDateString('et-EE', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadWeather() {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=58.60&longitude=25.00&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&hourly=temperature_2m&forecast_days=1&timezone=Europe%2FTallinn')
        .then(res => res.json())
        .then(data => {
          const cur = data.current;
          document.getElementById('temp').innerText = Math.round(cur.temperature_2m) + '°C';
          document.getElementById('feels').innerText = 'Tundub: ' + Math.round(cur.apparent_temperature) + '°C';
          document.getElementById('wind').innerText = 'Tuul: ' + Math.round(cur.wind_speed_10m / 3.6) + ' m/s';
          document.getElementById('humidity').innerText = 'Niiskus: ' + cur.relative_humidity_2m + '%';

          const currentHour = new Date().getHours();
          let forecastHtml = '';
          for (let i = 1; i <= 4; i++) {
            const h = (currentHour + i) % 24;
            const t = Math.round(data.hourly.temperature_2m[currentHour + i] || 0);
            forecastHtml += `<div><b>${h}:00</b><br>${t}°C</div>`;
          }
          document.getElementById('forecast').innerHTML = forecastHtml;
        })
        .catch(() => { document.getElementById('temp').innerText = 'Tõrge'; });
    }
    loadWeather();
    setInterval(loadWeather, 600000);

    function loadRSS() {
      fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.err.ee/rss')
        .then(res => res.json())
        .then(data => {
          const items = data.items.slice(0, 7);
          let html = '';
          items.forEach(item => {
            const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').trim();
            html += `
              <div class="rss-item">
                <div class="rss-item-title">• ${item.title}</div>
                <div class="rss-item-desc">${cleanDesc}</div>
              </div>`;
          });
          document.getElementById('rss-feed').innerHTML = html;
        })
        .catch(() => { document.getElementById('rss-feed').innerText = 'Uudiste laadimine ebaõnnestus'; });
    }
    loadRSS();
    setInterval(loadRSS, 900000);
  </script>
</body>
</html>
